version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraudguard
      POSTGRES_PASSWORD: fraudguard
      POSTGRES_DB: fraudguard
    ports:
      - "5432:5432"
    volumes:
      - fraudguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://fraudguard:fraudguard@postgres:5432/fraudguard
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:?Set API_KEY in your environment before starting Docker Compose}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000/api/v1
      API_KEY: ${API_KEY:?Set API_KEY in your environment before starting Docker Compose}
      DATABASE_URL: postgresql+psycopg2://fraudguard:fraudguard@postgres:5432/fraudguard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

volumes:
  fraudguard_pg_data:
