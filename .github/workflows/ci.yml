name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy app
      - run: python -m pytest -q --basetemp .pytest-ci-tmp
      - run: python -m pip_audit -r requirements.txt

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-api-key-not-for-production-123456789
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail --retry 10 --retry-connrefused http://localhost:8000/health
      - run: curl --fail --retry 10 --retry-connrefused http://localhost:8000/api/v1/ready
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
